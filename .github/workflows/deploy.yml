name: Deploy Nuxt SSR to Ubuntu Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt SSR app
        run: npm run build
        env:
          NUXT_PUBLIC_APP_BUILD_VERSION: ${{ github.sha }}

      - name: Create release checksum manifest
        run: |
          set -Eeuo pipefail
          bash -n deploy/atomic-release.sh
          node --check deploy/ecosystem.dev.config.cjs
          cd .output
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../deploy/output.sha256

      - name: Upload immutable release staging via SSH
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".output/,deploy/"
          target: "/data/dev_unikorn/front-end/.incoming/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/"

      - name: Atomically activate release
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            sleep 2
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 20
            bash "/data/dev_unikorn/front-end/.incoming/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/deploy/atomic-release.sh" \
              "/data/dev_unikorn/front-end" \
              "${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" \
              "${{ github.sha }}" \
              "unikorn-dev" \
              "3001" \
              "3"
