name: Deploy Nuxt SSR to Ubuntu Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt SSR app
        run: npm run build
        env:
          NUXT_PUBLIC_APP_BUILD_VERSION: ${{ github.sha }}

      - name: Upload .output via SSH
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".output/"
          target: "/data/dev_unikorn/front-end/"

      - name: Restart Nuxt SSR Server (PM2)
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            sleep 2
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            nvm use 20
            ls -l /data/dev_unikorn/front-end/.output/server/index.mjs
            pm2 startOrReload /data/dev_unikorn/front-end/ecosystem.config.js
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/health >/dev/null; then
                exit 0
              fi
              sleep 3
            done
            pm2 logs --nostream --lines 100 || true
            exit 1
