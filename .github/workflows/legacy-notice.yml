name: Update legacy migration notice

on:
  push:
    branches: [agent/legacy-notice-public-access]
    paths: [.github/workflows/legacy-notice.yml]

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish verified notice without changing Nginx or databases
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          ssh_dir="$RUNNER_TEMP/legacy-notice-ssh"
          install -d -m 0700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          install -m 0600 /dev/null "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/key"
          notice_base64=$(base64 -w0 deploy/legacy-notice/index.html)
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=unikorn.axfff.com \
            -o UserKnownHostsFile=deploy/ssh_known_hosts -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" python3 - "$notice_base64" < deploy/legacy-notice/deploy.py
      - name: Verify public response
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://unikorn.axfff.com/ -o /tmp/legacy-notice-live.html
          cmp deploy/legacy-notice/index.html /tmp/legacy-notice-live.html
