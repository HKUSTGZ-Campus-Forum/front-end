name: Inspect legacy migration notice

on:
  push:
    branches: [agent/legacy-notice-public-access]
    paths: [.github/workflows/legacy-notice.yml]

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect only the old domain's migration notice
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          ssh_dir="$RUNNER_TEMP/legacy-notice-ssh"
          install -d -m 0700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          install -m 0600 /dev/null "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/key"
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=unikorn.axfff.com \
            -o UserKnownHostsFile=deploy/ssh_known_hosts -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" python3 -u - <<'PY'
          import os
          import re
          from pathlib import Path
          print('effective_uid:', os.geteuid())
          path = Path('/etc/nginx/sites-available/prod-unikorn')
          for line in path.read_text().splitlines():
              s = line.strip()
              if s.startswith(('include ', 'root ', 'alias ', 'location ', 'return ', 'proxy_pass ', 'server_name ')):
                  print(s if not s.startswith('return ') else s[:120])
          for root in (Path('/etc/nginx'), Path('/data/prod_unikorn')):
              for directory, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules', 'venv', 'backups', 'releases', 'back-end', 'incoming')]
                  for name in files:
                      path = Path(directory) / name
                      if path.suffix not in ('.html', '.conf'):
                          continue
                      try:
                          if path.stat().st_size > 100000:
                              continue
                          content = path.read_text()
                      except (OSError, UnicodeError):
                          continue
                      if 'network-notice' in content or 'UniKorn has moved' in content:
                          stat = path.stat()
                          print('notice_file:', path, 'uid:', stat.st_uid,
                                'writable:', os.access(path, os.W_OK),
                                'parent_writable:', os.access(path.parent, os.W_OK),
                                'bytes:', stat.st_size, flush=True)
          PY
