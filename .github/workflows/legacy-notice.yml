name: Inspect legacy migration notice

on:
  push:
    branches: [agent/legacy-notice-public-access]
    paths: [.github/workflows/legacy-notice.yml]

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect only the old domain's migration notice
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          ssh_dir="$RUNNER_TEMP/legacy-notice-ssh"
          install -d -m 0700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          install -m 0600 /dev/null "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/key"
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=unikorn.axfff.com \
            -o UserKnownHostsFile=deploy/ssh_known_hosts -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" python3 -u - <<'PY'
          import os, subprocess
          from pathlib import Path
          for directory in ('/data/prod_unikorn/front-end/_incoming/legacy-notice-20260823T162500Z', '/data/prod_unikorn/front-end'):
              for path in Path(directory).iterdir():
                  print('entry:', path, 'symlink:', path.is_symlink())
          for path in Path('/etc/nginx').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text()
              except (OSError, UnicodeError):
                  continue
              if any(word in text for word in ('old-site-notice', 'network-notice', 'Refresh', 'refresh')):
                  print('notice_config:', path)
                  for line in text.splitlines():
                      if any(word in line for word in ('old-site', 'root ', 'alias ', 'include ', 'return ', 'Refresh', 'refresh')):
                          print(line[:200])
          result = subprocess.run(['sudo', '-n', 'nginx', '-T'], capture_output=True, text=True)
          print('nginx_inspect_exit:', result.returncode)
          for line in result.stdout.splitlines():
              if any(word in line for word in ('old-site', 'network-notice', 'Refresh', 'refresh', 'migration-notice')):
                  print('active_config:', line[:200])
          for port in (80, 3000):
              result = subprocess.run(['curl', '-sS', '--max-time', '5', '-H', 'Host: unikorn.axfff.com', 'http://127.0.0.1:'+str(port)+'/'], capture_output=True, text=True)
              print('local_port:', port, 'notice:', 'network-notice' in result.stdout)
          PY
