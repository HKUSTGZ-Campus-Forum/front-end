name: Deploy Nuxt SSR to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Nuxt SSR app for production
        run: npm run build
        env:
          NODE_ENV: production
          NUXT_PUBLIC_API_BASE_URL: https://unikorn.axfff.com
          NUXT_PUBLIC_APP_BUILD_VERSION: ${{ github.sha }}

      - name: Verify built readiness endpoint
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          readiness_log="$RUNNER_TEMP/frontend-production-readiness.log"
          HOST=127.0.0.1 NITRO_HOST=127.0.0.1 PORT=3100 NITRO_PORT=3100 \
            node .output/server/index.mjs >"$readiness_log" 2>&1 &
          readiness_pid=$!
          trap 'kill "$readiness_pid" 2>/dev/null || true; wait "$readiness_pid" 2>/dev/null || true' EXIT

          response=""
          for attempt in $(seq 1 20); do
            response=$(curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3100/health 2>/dev/null || true)
            if [[ -n "$response" ]]; then break; fi
            sleep 1
          done

          if ! node -e '
            const payload = JSON.parse(process.argv[1]);
            const expected = process.argv[2];
            if (payload.status !== "ok" || payload.service !== "campus-forum-frontend" || payload.version !== expected) {
              process.exit(1);
            }
          ' "$response" "$EXPECTED_SHA"; then
            cat "$readiness_log" >&2
            exit 1
          fi

      - name: Create release checksum manifest
        run: |
          set -Eeuo pipefail
          bash -n deploy/atomic-release.sh
          bash -n deploy/verify-public-assets.sh
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("deploy/atomic-release-lock.py").read_text())'
          node --check deploy/ecosystem.prod.config.cjs
          ssh-keygen -lf deploy/ssh_known_hosts -E sha256 | grep -Fq 'SHA256:mG33HUMsz+94mAc8vjSe9aIpRoiVhvwiMI9NrC1sgTg'
          find .output deploy -type f ! -path 'deploy/release.sha256' \
            ! -path 'deploy/.gitignore' ! -path 'deploy/README.md' \
            ! -path '*/__pycache__/*' -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum > deploy/release.sha256

      - name: Configure pinned OpenSSH transport
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_HOST" && "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ -n "$DEPLOY_USER" && "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ -n "$DEPLOY_PRIVATE_KEY" ]]

          ssh_dir="$RUNNER_TEMP/frontend-production-deploy-ssh"
          install -d -m 0700 "$ssh_dir"
          install -m 0600 /dev/null "$ssh_dir/id_deploy"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/id_deploy"
          ssh-keygen -y -f "$ssh_dir/id_deploy" >/dev/null
          install -m 0600 deploy/ssh_known_hosts "$ssh_dir/known_hosts"

          install -m 0600 /dev/null "$ssh_dir/config"
          {
            printf 'Host unikorn-production-deploy\n'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  HostKeyAlias unikorn.axfff.com\n'
            printf '  IdentityFile %s\n' "$ssh_dir/id_deploy"
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
            printf '  StrictHostKeyChecking yes\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  ConnectTimeout 30\n'
            printf '  ConnectionAttempts 3\n'
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 4\n'
          } > "$ssh_dir/config"
          ssh -G -F "$ssh_dir/config" unikorn-production-deploy >/dev/null

      - name: Validate production host preconditions
        run: |
          set -Eeuo pipefail
          ssh_config="$RUNNER_TEMP/frontend-production-deploy-ssh/config"
          ssh -F "$ssh_config" unikorn-production-deploy bash -s <<'REMOTE_PREFLIGHT'
          set -Eeuo pipefail
          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"
          nvm use 20

          for command_name in cmp curl grep mktemp node pm2 python3 readlink sha256sum sort stat tar; do
            command -v "$command_name" >/dev/null
          done
          app_root=/data/prod_unikorn/front-end
          deploy_uid=$(id -u)
          [[ -d "$app_root" && ! -L "$app_root" && -w "$app_root" ]]
          app_root_uid=$(stat -c '%u' -- "$app_root")
          if [[ "$app_root_uid" != "$deploy_uid" ]]; then
            echo "Production frontend APP_ROOT must be owned by the deployment account (expected UID $deploy_uid, found $app_root_uid)" >&2
            exit 1
          fi

          nginx_site=/etc/nginx/sites-enabled/prod-unikorn
          [[ -r "$nginx_site" ]] || {
            echo "Production Nginx site must be readable: $nginx_site" >&2
            exit 1
          }
          nginx_site_real=$(readlink -f -- "$nginx_site")
          [[ "$nginx_site_real" == /etc/nginx/sites-available/* && -f "$nginx_site_real" && ! -L "$nginx_site_real" ]] || {
            echo "Production Nginx site must resolve to a real sites-available file" >&2
            exit 1
          }
          current_static_root="root /data/prod_unikorn/front-end/current/.output/public;"
          legacy_static_root="root /data/prod_unikorn/front-end/.output/public;"
          current_static_root_count=$(grep -F -c -- "$current_static_root" "$nginx_site_real" || true)
          legacy_static_root_count=$(grep -F -c -- "$legacy_static_root" "$nginx_site_real" || true)
          if [[ "$current_static_root_count" != "2" || "$legacy_static_root_count" != "0" ]]; then
            echo "Production Nginx static roots must follow current/.output/public (expected 2 current roots and 0 legacy roots)" >&2
            exit 1
          fi

          lock_path="$app_root/.deploy.lock"
          if [[ -e "$lock_path" || -L "$lock_path" ]]; then
            [[ -f "$lock_path" && ! -L "$lock_path" ]] || {
              echo "Production frontend deployment lock must be a regular file" >&2
              exit 1
            }
            lock_uid=$(stat -c '%u' -- "$lock_path")
            lock_links=$(stat -c '%h' -- "$lock_path")
            if [[ "$lock_uid" != "$deploy_uid" || "$lock_links" != "1" ]]; then
              echo "Production frontend deployment lock must be owned by UID $deploy_uid and have one hard link" >&2
              exit 1
            fi
          fi

          legacy_config="$app_root/ecosystem.config.js"
          [[ -f "$legacy_config" && ! -L "$legacy_config" ]]
          pm2_log_root=/var/unikorn/prod_pm2_log
          [[ -d "$pm2_log_root" && ! -L "$pm2_log_root" && -w "$pm2_log_root" ]]
          pm2_log_root_uid=$(stat -c '%u' -- "$pm2_log_root")
          pm2_log_root_mode=$(stat -c '%a' -- "$pm2_log_root")
          if [[ "$pm2_log_root_uid" != "$deploy_uid" ]] || (( (8#$pm2_log_root_mode & 0022) != 0 )); then
            echo "Production frontend PM2 log directory must be deployment-owned and not group/other-writable" >&2
            exit 1
          fi
          for log_name in pm2-out.log pm2-error.log; do
            log_path="$pm2_log_root/$log_name"
            if [[ -e "$log_path" || -L "$log_path" ]]; then
              [[ -f "$log_path" && ! -L "$log_path" && -w "$log_path" ]] || {
                echo "Production frontend PM2 log must be a writable regular file: $log_path" >&2
                exit 1
              }
              log_uid=$(stat -c '%u' -- "$log_path")
              log_links=$(stat -c '%h' -- "$log_path")
              if [[ "$log_uid" != "$deploy_uid" || "$log_links" != "1" ]]; then
                echo "Production frontend PM2 log must be owned by UID $deploy_uid and have one hard link: $log_path" >&2
                exit 1
              fi
            fi
          done

          validate_legacy_log_targets() {
            CAMPUS_FRONTEND_ROOT="$app_root" \
              CAMPUS_FRONTEND_PORT=3000 \
              CAMPUS_FRONTEND_PM2_APP=prod-unikorn-frontend \
              CAMPUS_FRONTEND_RELEASE_SHA=legacy \
              node - "$1" <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const configPath = process.argv[2];
          const moduleRecord = { exports: {} };
          vm.runInNewContext(fs.readFileSync(configPath, "utf8"), {
            module: moduleRecord,
            exports: moduleRecord.exports,
            process: { env: process.env },
          }, { filename: configPath, timeout: 1000 });
          const apps = moduleRecord.exports?.apps;
          const matches = Array.isArray(apps)
            ? apps.filter((app) => app?.name === "prod-unikorn-frontend")
            : [];
          if (matches.length !== 1) process.exit(2);
          const app = matches[0];
          if (
            app.error_file !== "/var/unikorn/prod_pm2_log/pm2-error.log" ||
            app.out_file !== "/var/unikorn/prod_pm2_log/pm2-out.log"
          ) process.exit(3);
          NODE
          }
          validate_legacy_log_targets "$legacy_config"

          current_link="$app_root/current"
          if [[ -L "$current_link" && $(readlink -- "$current_link") == "releases/legacy-in-place" ]]; then
            frozen_legacy_config="$app_root/releases/legacy-ecosystem.config.cjs"
            [[ -f "$frozen_legacy_config" && ! -L "$frozen_legacy_config" ]]
            cmp -s -- "$legacy_config" "$frozen_legacy_config"
            validate_legacy_log_targets "$frozen_legacy_config"
          fi
          [[ $(df -Pk "$app_root" | awk 'NR == 2 { print $4 }') =~ ^[0-9]+$ ]]
          (( $(df -Pk "$app_root" | awk 'NR == 2 { print $4 }') >= 1048576 ))
          pm2 jlist >/dev/null
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null
          if command -v ss >/dev/null 2>&1; then
            ss -ltn | awk '$4 ~ /:3000$/ { found=1 } END { exit found ? 0 : 1 }'
          elif command -v lsof >/dev/null 2>&1; then
            lsof -nP -iTCP:3000 -sTCP:LISTEN >/dev/null
          else
            echo "Could not inspect the port 3000 listener: neither ss nor lsof is installed" >&2
            exit 1
          fi
          REMOTE_PREFLIGHT

      - name: Upload immutable release staging with OpenSSH
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          ssh_config="$RUNNER_TEMP/frontend-production-deploy-ssh/config"
          remote_staging="/data/prod_unikorn/front-end/.incoming/$RELEASE_ID"

          ssh -F "$ssh_config" unikorn-production-deploy \
            bash -s -- "$remote_staging" <<'REMOTE_PREPARE'
          set -Eeuo pipefail
          staging_dir=$1
          [[ "$staging_dir" =~ ^/data/prod_unikorn/front-end/\.incoming/[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          app_root=/data/prod_unikorn/front-end
          incoming_root="$app_root/.incoming"
          [[ -d "$app_root" && ! -L "$app_root" ]]
          if [[ -e "$incoming_root" || -L "$incoming_root" ]]; then
            [[ -d "$incoming_root" && ! -L "$incoming_root" ]]
          else
            mkdir -- "$incoming_root"
            [[ -d "$incoming_root" && ! -L "$incoming_root" ]]
          fi
          [[ $(dirname -- "$staging_dir") == "$incoming_root" ]]
          [[ ! -e "$staging_dir" && ! -L "$staging_dir" ]]
          mkdir -- "$staging_dir"
          [[ -d "$staging_dir" && ! -L "$staging_dir" ]]
          REMOTE_PREPARE

          tar -czf - .output deploy | \
            ssh -F "$ssh_config" unikorn-production-deploy \
              tar -xzf - --no-same-owner --no-same-permissions -C "$remote_staging"

      - name: Atomically activate production release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_config="$RUNNER_TEMP/frontend-production-deploy-ssh/config"
          remote_script="/data/prod_unikorn/front-end/.incoming/$RELEASE_ID/deploy/atomic-release.sh"

          ssh -F "$ssh_config" unikorn-production-deploy \
            bash -s -- "$remote_script" "$RELEASE_ID" "$EXPECTED_SHA" <<'REMOTE_ACTIVATE'
          set -Eeuo pipefail
          remote_script=$1
          release_id=$2
          expected_sha=$3
          [[ "$remote_script" == "/data/prod_unikorn/front-end/.incoming/$release_id/deploy/atomic-release.sh" ]]
          [[ "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"
          nvm use 20
          export DEPLOY_PUBLIC_HEALTH_URL="https://unikorn.axfff.com/health"
          export DEPLOY_PUBLIC_ROOT_URL="https://unikorn.axfff.com/"
          export DEPLOY_PUBLIC_PLANNER_URL="https://unikorn.axfff.com/courses/planner"
          export DEPLOY_PUBLIC_PLANNER_EN_URL="https://unikorn.axfff.com/en/courses/planner"
          exec bash "$remote_script" \
            "/data/prod_unikorn/front-end" \
            "$release_id" \
            "$expected_sha" \
            "prod-unikorn-frontend" \
            "3000" \
            "3" \
            "deploy/ecosystem.prod.config.cjs"
          REMOTE_ACTIVATE

      # Atomic acceptance already ran on-host while rollback was armed. This
      # redundant probe confirms the same routes from the external runner.
      - name: Confirm public production from external runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          health_url="https://unikorn.axfff.com/health"
          root_url="https://unikorn.axfff.com/"
          planner_url="https://unikorn.axfff.com/courses/planner"
          planner_en_url="https://unikorn.axfff.com/en/courses/planner"

          for attempt in $(seq 1 20); do
            response=$(curl --fail --silent --show-error --max-time 10 \
              -H 'Cache-Control: no-cache' "$health_url" 2>/dev/null || true)
            if node -e '
              const payload = JSON.parse(process.argv[1]);
              const expected = process.argv[2];
              if (payload.status !== "ok" || payload.service !== "campus-forum-frontend" || payload.version !== expected) {
                process.exit(1);
              }
            ' "$response" "$EXPECTED_SHA" 2>/dev/null && \
              bash deploy/verify-public-assets.sh \
                .output/public \
                "$root_url" \
                "$planner_url" \
                "$planner_en_url" >/dev/null; then
              exit 0
            fi
            sleep 3
          done

          echo "Public production did not expose build $EXPECTED_SHA with release-matched assets" >&2
          exit 1
