name: Deploy Nuxt SSR to Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Nuxt SSR app for production
        run: npm run build
        env:
          NODE_ENV: production
          NUXT_PUBLIC_API_BASE_URL: https://unikorn.axfff.com
          NUXT_PUBLIC_APP_BUILD_VERSION: ${{ github.sha }}

      - name: Verify built readiness endpoint
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          readiness_log="$RUNNER_TEMP/frontend-production-readiness.log"
          HOST=127.0.0.1 NITRO_HOST=127.0.0.1 PORT=3100 NITRO_PORT=3100 \
            node .output/server/index.mjs >"$readiness_log" 2>&1 &
          readiness_pid=$!
          trap 'kill "$readiness_pid" 2>/dev/null || true; wait "$readiness_pid" 2>/dev/null || true' EXIT

          response=""
          for attempt in $(seq 1 20); do
            response=$(curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3100/health 2>/dev/null || true)
            if [[ -n "$response" ]]; then break; fi
            sleep 1
          done

          if ! node -e '
            const payload = JSON.parse(process.argv[1]);
            const expected = process.argv[2];
            if (payload.status !== "ok" || payload.service !== "campus-forum-frontend" || payload.version !== expected) {
              process.exit(1);
            }
          ' "$response" "$EXPECTED_SHA"; then
            cat "$readiness_log" >&2
            exit 1
          fi

      - name: Create release checksum manifest
        run: |
          set -Eeuo pipefail
          bash -n deploy/atomic-release.sh
          node --check deploy/ecosystem.prod.config.cjs
          ssh-keygen -lf deploy/ssh_known_hosts -E sha256 | grep -Fq 'SHA256:mG33HUMsz+94mAc8vjSe9aIpRoiVhvwiMI9NrC1sgTg'
          cd .output
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../deploy/output.sha256

      - name: Configure pinned OpenSSH transport
        env:
          DEPLOY_HOST: ${{ secrets.PROD_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_SSH_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_HOST" && "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ -n "$DEPLOY_USER" && "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ -n "$DEPLOY_PRIVATE_KEY" ]]

          ssh_dir="$RUNNER_TEMP/frontend-production-deploy-ssh"
          install -d -m 0700 "$ssh_dir"
          install -m 0600 /dev/null "$ssh_dir/id_deploy"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$ssh_dir/id_deploy"
          ssh-keygen -y -f "$ssh_dir/id_deploy" >/dev/null
          install -m 0600 deploy/ssh_known_hosts "$ssh_dir/known_hosts"

          install -m 0600 /dev/null "$ssh_dir/config"
          {
            printf 'Host unikorn-production-deploy\n'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  HostKeyAlias unikorn.axfff.com\n'
            printf '  IdentityFile %s\n' "$ssh_dir/id_deploy"
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
            printf '  StrictHostKeyChecking yes\n'
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  ConnectTimeout 30\n'
            printf '  ConnectionAttempts 3\n'
            printf '  ServerAliveInterval 15\n'
            printf '  ServerAliveCountMax 4\n'
          } > "$ssh_dir/config"
          ssh -G -F "$ssh_dir/config" unikorn-production-deploy >/dev/null

      - name: Validate production host preconditions
        run: |
          set -Eeuo pipefail
          ssh_config="$RUNNER_TEMP/frontend-production-deploy-ssh/config"
          ssh -F "$ssh_config" unikorn-production-deploy bash -s <<'REMOTE_PREFLIGHT'
          set -Eeuo pipefail
          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"
          nvm use 20

          for command_name in curl flock node pm2 sha256sum tar; do
            command -v "$command_name" >/dev/null
          done
          [[ -d /data/prod_unikorn/front-end && -w /data/prod_unikorn/front-end ]]
          [[ -f /data/prod_unikorn/front-end/ecosystem.config.js ]]
          [[ -d /var/unikorn/prod_log && -w /var/unikorn/prod_log ]]
          [[ $(df -Pk /data/prod_unikorn/front-end | awk 'NR == 2 { print $4 }') =~ ^[0-9]+$ ]]
          (( $(df -Pk /data/prod_unikorn/front-end | awk 'NR == 2 { print $4 }') >= 1048576 ))
          pm2 jlist >/dev/null
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null
          if command -v ss >/dev/null 2>&1; then
            ss -ltn | awk '$4 ~ /:3000$/ { found=1 } END { exit found ? 0 : 1 }'
          elif command -v lsof >/dev/null 2>&1; then
            lsof -nP -iTCP:3000 -sTCP:LISTEN >/dev/null
          else
            echo "Could not inspect the port 3000 listener: neither ss nor lsof is installed" >&2
            exit 1
          fi
          REMOTE_PREFLIGHT

      - name: Upload immutable release staging with OpenSSH
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          ssh_config="$RUNNER_TEMP/frontend-production-deploy-ssh/config"
          remote_staging="/data/prod_unikorn/front-end/.incoming/$RELEASE_ID"

          ssh -F "$ssh_config" unikorn-production-deploy \
            bash -s -- "$remote_staging" <<'REMOTE_PREPARE'
          set -Eeuo pipefail
          staging_dir=$1
          [[ "$staging_dir" =~ ^/data/prod_unikorn/front-end/\.incoming/[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ ! -e "$staging_dir" && ! -L "$staging_dir" ]]
          mkdir -p -- "$staging_dir"
          REMOTE_PREPARE

          tar -czf - .output deploy | \
            ssh -F "$ssh_config" unikorn-production-deploy \
              tar -xzf - --no-same-owner --no-same-permissions -C "$remote_staging"

      - name: Atomically activate production release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_config="$RUNNER_TEMP/frontend-production-deploy-ssh/config"
          remote_script="/data/prod_unikorn/front-end/.incoming/$RELEASE_ID/deploy/atomic-release.sh"

          ssh -F "$ssh_config" unikorn-production-deploy \
            bash -s -- "$remote_script" "$RELEASE_ID" "$EXPECTED_SHA" <<'REMOTE_ACTIVATE'
          set -Eeuo pipefail
          remote_script=$1
          release_id=$2
          expected_sha=$3
          [[ "$remote_script" == "/data/prod_unikorn/front-end/.incoming/$release_id/deploy/atomic-release.sh" ]]
          [[ "$release_id" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"
          nvm use 20
          exec bash "$remote_script" \
            "/data/prod_unikorn/front-end" \
            "$release_id" \
            "$expected_sha" \
            "prod-unikorn-frontend" \
            "3000" \
            "3" \
            "deploy/ecosystem.prod.config.cjs"
          REMOTE_ACTIVATE
