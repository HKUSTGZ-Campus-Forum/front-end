name: Frontend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Test and build
        run: |
          set -Eeuo pipefail
          npm ci
          npm run i18n:check
          npm test
          NUXT_PUBLIC_APP_BUILD_VERSION="${GITHUB_SHA}" \
            npm run build

      - name: Build production container
        run: |
          set -Eeuo pipefail
          docker build \
            --platform linux/amd64 \
            --build-arg NUXT_PUBLIC_APP_BUILD_VERSION="${GITHUB_SHA}" \
            --tag "campus-forum-frontend:${GITHUB_SHA}" \
            .
          test "$(docker image inspect "campus-forum-frontend:${GITHUB_SHA}" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "campus-forum-frontend:${GITHUB_SHA}" --format '{{.Config.User}}')" = node
          test -n "$(docker image inspect "campus-forum-frontend:${GITHUB_SHA}" --format '{{json .Config.Healthcheck.Test}}')"
