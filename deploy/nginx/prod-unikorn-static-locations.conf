# Host Nginx contract for atomic frontend releases.
# Include these locations in the unikorn.axfff.com TLS server block.
location /_nuxt/ {
    root /data/prod_unikorn/front-end/current/.output/public;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
}

location /static/ {
    root /data/prod_unikorn/front-end/current/.output/public;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
